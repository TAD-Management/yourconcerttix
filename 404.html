<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | YourConcertTix</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f23;--accent:#e94560;--gold:#f5a623;--text:#e8e8f0;--muted:#9a9ab8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:radial-gradient(60% 45% at 15% 0%, rgba(233,69,96,.3), transparent 70%),radial-gradient(55% 45% at 85% 10%, rgba(142,45,226,.3), transparent 70%),var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;line-height:1.5}
a{color:inherit;text-decoration:none}
.brand{font-family:'Montserrat',sans-serif;font-weight:800;font-size:18px;margin-bottom:34px}
.brand span{color:var(--accent)}
h1{font-family:'Montserrat',sans-serif;font-weight:900;font-size:clamp(30px,6vw,56px);letter-spacing:-.03em;line-height:1}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--muted);max-width:520px;margin:16px auto 0;font-size:16px}
p strong{color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:8px;margin:26px 6px 0;padding:13px 20px;border-radius:12px;font-family:'Montserrat',sans-serif;font-weight:800;color:#fff;background:linear-gradient(90deg,var(--accent),var(--gold))}
.ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-family:'Inter',sans-serif;font-weight:600}
</style>
</head>
<body>
<a class="brand" href="/">Your<span>Concert</span>Tix</a>
<h1>That page isn't <em>here yet</em></h1>
<p id="msg">We couldn't find that address. Check the link, or head back to the full concert calendar.</p>
<div><a class="btn" href="/">See all shows</a><a class="btn ghost" href="/affiliate/">Affiliate sign-in</a></div>
<script>
if (/^\/a\/[a-z0-9-]+/.test(location.pathname)) {
  document.getElementById('msg').innerHTML = "This looks like an affiliate page that isn't published yet. <strong>New pages go live a few minutes after links are created</strong>, so try again shortly. If it still isn't here, the address may have changed or the page may have been taken down.";
}
</script>
</body>
</html>
